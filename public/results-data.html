<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dati Votazione LAB2GO</title>
</head>
<body>
<script>
async function fetchResults() {
    const res = await fetch("/results");
    const data = await res.json();

    // Definizione percorsi e scuole
    const percorsi = {
        "Botanica": ["Pietrobono", "Galilei", "Morgani", "Ferro"],
        "Biologia Animale": ["Socrate", "Bottardi", "Keynes"],
        "Chimica": ["Mamiani", "Pertini Falcone", "Cavour", "Garibaldi", "Torricelli", "Montessori"],
        "Fisica": ["Francesco d'Assisi", "Cornelio Tacito", "Lorenzo Rocci", "Vittoria Colonna", "Sandro Pertini", "Gaetano De Santis", "Nomentano", "Righi", "Lucrezio Caro", "Vian", "Polo Liceale Alighieri", "Giulio Cesare", "Albertelli"],
        "Progetto Musei": ["Massimo", "Vittoria Colonna", "Pertini"],
        "Scienze della Terra": ["Labriola", "Galileo Galilei", "Levi Ciita"]
    };

    const results = {};

    // Inizializza struttura risultati
    for (const percorso in percorsi) {
        results[percorso] = {};
        percorsi[percorso].forEach(scuola => {
            results[percorso][scuola] = 0;
        });
    }

    // Aggrega voti
    data.forEach(vote => {
        const choices = vote.choice.split(", ").map(c => c.trim());
        choices.forEach(c => {
            for (const percorso in percorsi) {
                if (percorsi[percorso].includes(c)) {
                    results[percorso][c]++;
                }
            }
        });
    });

    return results;
}

// Espone dati JSON
fetchResults().then(results => {
    document.body.innerHTML = `<pre>${JSON.stringify(results, null, 2)}</pre>`;
});
</script>
</body>
</html>
