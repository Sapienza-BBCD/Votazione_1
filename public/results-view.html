<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LIVE - Risultati LAB2GO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(#1E3A8A, #0f172a);
  color: white;
  margin: 0;
}

h1 {
  text-align: center;
  padding: 20px;
  font-size: 40px;
}

#totalVotes {
  text-align:center;
  font-size:24px;
  margin-bottom:10px;
}

/* GRAFICO */
canvas {
  width: 90%;
  max-width: 1100px;
  margin: 20px auto;
  display: block;
  background: white;
  border-radius: 12px;
  padding: 10px;
}

/* SEZIONI */
.percorso {
  margin: 30px auto;
  width: 85%;
}

.percorso h2 {
  text-align: center;
  border-bottom: 2px solid white;
  padding-bottom: 10px;
}

/* BARRE LISTA */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

td {
  padding: 10px;
  border-bottom: 1px solid #ffffff33;
}

.bar {
  height: 20px;
  border-radius: 6px;
  background: linear-gradient(90deg, #60A5FA, #3B82F6);
  transition: width 0.8s ease-in-out;
}

.titolo {
  font-size: 12px;
  opacity: 0.8;
  display: block;
}
</style>

</head>

<body>

<h1>🏆 RISULTATI LIVE LAB2GO</h1>

<div id="totalVotes">Totale voti: 0</div>

<canvas id="chart"></canvas>

<div id="resultsContainer"></div>

<script>

/* =========================
   CONFIG CATEGORIE
========================= */
const categorie = [
  "Fisica",
  "Biologia vegetale",
  "Biologia animale",
  "Chimica",
  "Musei scientifici",
  "Scienze della Terra"
];

/* =========================
   CLASSIFICAZIONE
========================= */
function getCategoria(p) {
  p = p.toLowerCase();

  if (p.includes("fisica")) return "Fisica";
  if (p.includes("biologia vegetale")) return "Biologia vegetale";
  if (p.includes("biologia animale")) return "Biologia animale";
  if (p.includes("chimica")) return "Chimica";
  if (p.includes("musei")) return "Musei scientifici";
  if (p.includes("terra")) return "Scienze della Terra";

  return "Altro";
}

function getTipo(p) {
  p = p.toLowerCase();

  if (p.includes("talk")) return "Talk";
  if (p.includes("esperimento")) return "Esperimento";
  if (p.includes("poster")) return "Poster";

  return "Altro";
}

/* =========================
   FETCH
========================= */
async function fetchResults() {
  const res = await fetch("/results-data?t=" + Date.now());
  return await res.json();
}

/* =========================
   GRAFICO
========================= */
let chart;

function renderChart(data) {

  const ctx = document.getElementById("chart");

  const talk = categorie.map(c => data[c]["Talk"]);
  const esperimento = categorie.map(c => data[c]["Esperimento"]);
  const poster = categorie.map(c => data[c]["Poster"]);

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: categorie,
      datasets: [
        {
          label: "Talk",
          data: talk,
          backgroundColor: "#60A5FA",
          borderRadius: 6
        },
        {
          label: "Esperimento",
          data: esperimento,
          backgroundColor: "#34D399",
          borderRadius: 6
        },
        {
          label: "Poster",
          data: poster,
          backgroundColor: "#FBBF24",
          borderRadius: 6
        }
      ]
    },
    options: {
      responsive: true,

      animation: {
        duration: 1200,
        easing: "easeOutQuart"
      },

      scales: {
        y: {
          beginAtZero: true,
          ticks: { precision: 0 }
        }
      }
    }
  });
}

/* =========================
   RENDER
========================= */
function renderResults(data) {

  const container = document.getElementById("resultsContainer");
  container.innerHTML = "";

  /* 🔥 contatore animato */
  let displayed = 0;
  const target = data.totale;

  const counter = setInterval(() => {
    displayed += Math.ceil(target / 25);

    if (displayed >= target) {
      displayed = target;
      clearInterval(counter);
    }

    document.getElementById("totalVotes").innerText =
      "Totale voti: " + displayed;

  }, 20);

  if (!data.risultati || data.risultati.length === 0) return;

  /* 🔥 struttura grafico */
  const chartData = {
    "Fisica": { Talk:0, Esperimento:0, Poster:0 },
    "Biologia vegetale": { Talk:0, Esperimento:0, Poster:0 },
    "Biologia animale": { Talk:0, Esperimento:0, Poster:0 },
    "Chimica": { Talk:0, Esperimento:0, Poster:0 },
    "Musei scientifici": { Talk:0, Esperimento:0, Poster:0 },
    "Scienze della Terra": { Talk:0, Esperimento:0, Poster:0 }
  };

  data.risultati.forEach(r => {

    const cat = getCategoria(r.percorso);
    const tipo = getTipo(r.percorso);

    if (chartData[cat]) {
      chartData[cat][tipo] += r.votes;
    }
  });

  renderChart(chartData);

  /* 🔥 lista sotto */
  data.risultati.forEach(r => {

    const div = document.createElement("div");
    div.className = "percorso";

    div.innerHTML = `
      <h2>${r.percorso}</h2>
      <div>${r.scuola} — <b>${r.votes}</b> voti</div>
    `;

    container.appendChild(div);
  });
}

/* =========================
   LIVE UPDATE
========================= */
async function update() {
  const data = await fetchResults();
  renderResults(data);
}

update();
setInterval(update, 3000);

</script>

</body>
</html>
