<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Risultati in Diretta - LAB2GO</title>

<style>
body {
  font-family: Arial;
  background: #1E3A8A;
  color: white;
  margin: 0;
}

h1 {
  text-align: center;
  padding: 20px;
}

#totalVotes {
  text-align:center;
  font-size:22px;
  margin-bottom:20px;
}

/* PERCORSO */
.percorso {
  margin: 40px auto;
  width: 80%;
}

/* TITOLO */
.percorso h2 {
  text-align: center;
  border-bottom: 2px solid white;
  padding-bottom: 10px;
}

/* PODIO */
.podio {
  display: flex;
  justify-content: space-around;
  margin-top: 20px;
  text-align: center;
}

.podio div {
  width: 30%;
  padding: 10px;
  border-radius: 10px;
}

.first { background: gold; color: black; }
.second { background: silver; color: black; }
.third { background: #cd7f32; color: black; }

/* TABELLA */
table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
}

td {
  padding: 10px;
  border-bottom: 1px solid white;
}

/* BARRE */
.bar {
  background: #60A5FA;
  height: 20px;
  display: inline-block;
  transition: width 0.5s;
}
</style>

</head>

<body>

<h1>Risultati in Diretta - LAB2GO</h1>
<div id="totalVotes">Totale voti raccolti: 0</div>

<div id="resultsContainer"></div>

<script>
async function fetchResults() {
  const res = await fetch("/results-data");
  return await res.json();
}

function renderResults(data) {

  const container = document.getElementById("resultsContainer");
  container.innerHTML = "";

  document.getElementById("totalVotes").innerText =
    "Totale voti raccolti: " + data.totale;

  // Raggruppa per percorso
  const grouped = {};

  data.risultati.forEach(r => {
    if (!grouped[r.percorso]) grouped[r.percorso] = [];
    grouped[r.percorso].push(r);
  });

  // Per ogni percorso
  for (const percorso in grouped) {

    const elenco = grouped[percorso];

    // ordina per voti DESC
    elenco.sort((a,b) => b.votes - a.votes);

    const div = document.createElement("div");
    div.className = "percorso";

    const titolo = document.createElement("h2");
    titolo.innerText = percorso;
    div.appendChild(titolo);

    // PODIO (primi 3)
    const podio = document.createElement("div");
    podio.className = "podio";

    if (elenco[0]) {
      podio.innerHTML += `<div class="first">🥇 ${elenco[0].scuola}<br>${elenco[0].votes} voti</div>`;
    }
    if (elenco[1]) {
      podio.innerHTML += `<div class="second">🥈 ${elenco[1].scuola}<br>${elenco[1].votes} voti</div>`;
    }
    if (elenco[2]) {
      podio.innerHTML += `<div class="third">🥉 ${elenco[2].scuola}<br>${elenco[2].votes} voti</div>`;
    }

    div.appendChild(podio);

    // TABELLA COMPLETA
    const table = document.createElement("table");

    elenco.forEach(r => {
      const tr = document.createElement("tr");

      const td1 = document.createElement("td");
      td1.innerText = r.scuola;

      const td2 = document.createElement("td");
      td2.innerHTML =
        `<div class="bar" style="width:${r.votes * 30}px;"></div> ${r.votes} voti`;

      tr.appendChild(td1);
      tr.appendChild(td2);

      table.appendChild(tr);
    });

    div.appendChild(table);
    container.appendChild(div);
  }
}

// aggiornamento live
async function update(){
  const data = await fetchResults();
  renderResults(data);
}

update();
setInterval(update, 2000);
</script>

</body>
</html>
