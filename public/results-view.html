<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LIVE - Risultati LAB2GO</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(#1E3A8A, #0f172a);
  color: white;
  margin: 0;
}

h1 {
  text-align: center;
  padding: 20px;
  font-size: 40px;
}

#totalVotes {
  text-align:center;
  font-size:24px;
  margin-bottom:20px;
}

/* PERCORSO */
.percorso {
  margin: 40px auto;
  width: 85%;
}

/* TITOLO */
.percorso h2 {
  text-align: center;
  border-bottom: 2px solid white;
  padding-bottom: 10px;
}

/* PODIO */
.podio {
  display: flex;
  justify-content: space-around;
  margin-top: 30px;
}

.podio div {
  width: 30%;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  animation: slideUp 0.8s ease;
}

@keyframes slideUp {
  from { transform: translateY(100px); opacity:0; }
  to { transform: translateY(0); opacity:1; }
}

.first {
  background: gold;
  color: black;
  transform: scale(1.1);
  box-shadow: 0 0 20px gold;
}

.second { background: silver; color: black; }
.third { background: #cd7f32; color: black; }

/* TABELLA */
table {
  width: 100%;
  margin-top: 25px;
  border-collapse: collapse;
}

td {
  padding: 10px;
  border-bottom: 1px solid #ffffff33;
}

/* BARRE */
.bar {
  background: linear-gradient(90deg, #60A5FA, #3B82F6);
  height: 22px;
  display: inline-block;
  border-radius: 6px;
  transition: width 0.6s ease;
}

/* TITOLO PICCOLO */
.titolo {
  font-style: italic;
  font-size: 13px;
  display: block;
  opacity: 0.8;
}

/* LEADER HIGHLIGHT */
.leader {
  font-weight: bold;
  color: #FFD700;
  font-size: 18px;
}
</style>

</head>

<body>

<h1>🏆 RISULTATI LIVE LAB2GO</h1>
<div id="totalVotes">Totale voti: 0</div>

<div id="resultsContainer"></div>

<script>

// 🔥 USA LA STESSA MAPPATURA TITOLI DI PRIMA
const titoli = {
  "Fisica - Esperimento|IIS Gaetano De Sanctis": "Sensori, Motori e Gravità",
  "Fisica - Esperimento|G. Lombardo Radice": "Esperimenti vari",
  "Chimica - Esperimento|Liceo Terenzio Mamiani": "Chimica e sostenibilità",
  "Biologia Animale - Talk|Liceo Socrate Roma": "Ricostruzione 3D"
  // 👉 puoi lasciare anche solo i principali
};

function getTitolo(percorso, scuola) {
  return titoli[`${percorso}|${scuola}`] || "";
}

async function fetchResults() {
  const res = await fetch("/results-data");
  return await res.json();
}

function renderResults(data) {

  const container = document.getElementById("resultsContainer");
  container.innerHTML = "";

  document.getElementById("totalVotes").innerText =
    "Totale voti: " + data.totale;

  const grouped = {};

  data.risultati.forEach(r => {
    if (!grouped[r.percorso]) grouped[r.percorso] = [];
    grouped[r.percorso].push(r);
  });

  for (const percorso in grouped) {

    const elenco = grouped[percorso];
    elenco.sort((a,b) => b.votes - a.votes);

    const maxVotes = elenco[0]?.votes || 1;

    const div = document.createElement("div");
    div.className = "percorso";

    const titolo = document.createElement("h2");
    titolo.innerText = percorso;
    div.appendChild(titolo);

    // 🏆 PODIO
    const podio = document.createElement("div");
    podio.className = "podio";

    [0,1,2].forEach(i => {
      if (elenco[i]) {
        const classe = ["first","second","third"][i];

        podio.innerHTML += `
          <div class="${classe}">
            ${["🥇","🥈","🥉"][i]} 
            <div class="leader">${elenco[i].scuola}</div>
            <span class="titolo">${getTitolo(percorso, elenco[i].scuola)}</span>
            <br>${elenco[i].votes} voti
          </div>
        `;
      }
    });

    div.appendChild(podio);

    // 📊 TABELLA
    const table = document.createElement("table");

    elenco.forEach(r => {

      const percent = (r.votes / maxVotes) * 100;

      const tr = document.createElement("tr");

      const td1 = document.createElement("td");
      td1.innerHTML = `
        ${r.scuola}
        <span class="titolo">${getTitolo(r.percorso, r.scuola)}</span>
      `;

      const td2 = document.createElement("td");
      td2.innerHTML =
        `<div class="bar" style="width:${percent}%"></div> ${r.votes}`;

      tr.appendChild(td1);
      tr.appendChild(td2);

      table.appendChild(tr);
    });

    div.appendChild(table);
    container.appendChild(div);
  }
}

// 🔁 AUTO REFRESH FLUIDO
async function update(){
  const data = await fetchResults();
  renderResults(data);
}

update();
setInterval(update, 2000);

</script>

</body>
</html>
