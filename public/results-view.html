<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Risultati in Diretta - LAB2GO</title>

<style>
body {
  font-family: Arial;
  background: #1E3A8A;
  color: white;
  margin: 0;
}

h1 {
  text-align: center;
  padding: 20px;
}

#totalVotes {
  text-align:center;
  font-size:22px;
  margin-bottom:20px;
}

/* PERCORSO */
.percorso {
  margin: 40px auto;
  width: 80%;
}

/* TITOLO */
.percorso h2 {
  text-align: center;
  border-bottom: 2px solid white;
  padding-bottom: 10px;
}

/* PODIO */
.podio {
  display: flex;
  justify-content: space-around;
  margin-top: 20px;
  text-align: center;
}

.podio div {
  width: 30%;
  padding: 10px;
  border-radius: 10px;
  transition: transform 0.3s;
}

.podio div:hover {
  transform: scale(1.05);
}

.first { background: gold; color: black; }
.second { background: silver; color: black; }
.third { background: #cd7f32; color: black; }

/* TABELLA */
table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
}

td {
  padding: 10px;
  border-bottom: 1px solid white;
}

/* BARRE */
.bar {
  background: #60A5FA;
  height: 20px;
  display: inline-block;
  transition: width 0.5s;
}
</style>

</head>

<body>

<h1>Risultati in Diretta - LAB2GO</h1>
<div id="totalVotes">Totale voti raccolti: 0</div>

<div id="resultsContainer"></div>

<script>

// 🔥 MAPPATURA CONTRIBUTI (percorso + scuola)
const contributi = {
  "Biologia Animale|Bottardi": "Orale",
  "Biologia Animale|Keynes": "Esperienza",
  "Biologia Animale|Socrate": "Poster",

  "Botanica|Levi Civita": "Orale",  
  "Botanica|Majorana": "Poster",
  "Botanica|Neumann": "Poster",
  "Botanica|Perini Falcone": "Poster",
  "Botanica|Righi": "Poster",

  "Chimica|Cavour": "Poster",
  "Chimica|Garibaldi": "Poster",
  "Chimica|Mamiani": "Poster",
  "Chimica|Montessori": "Orale",
  "Chimica|Torricelli": "Orale",

  "Fisica|Albertelli": "Orale",    
  "Fisica|Cornelio Tacito": "Esperienza",
  "Fisica|De Santis": "Esperienza",
  "Fisica|Francesco d'Assisi": "Esperienza",
  "Fisica|Giulio Cesare": "Orale",    
  "Fisica|Lorenzo Rocci": "Orale",
  "Fisica|Lucrezio Caro": "Esperienza",
  "Fisica|Sandro Pertini": "Esperienza",
  "Fisica|Nomentano": "Orale",
  "Fisica|Polo Liceale Alighieri": "Orale",
  "Fisica|Righi": "Orale",
  "Fisica|Vian": "Esperienza",
  "Fisica|Vittoria Colonna": "Orale",

  "Progetto Musei|Massimo": "Poster",
  "Progetto Musei|Pertini": "Orale"
  "Progetto Musei|Vittoria Colonna": "Orale",

  "Scienze della Terra|Galileo Galilei": "Poster",
  "Scienze della Terra|Labriola": "Poster",
  "Scienze della Terra|Levi Civita": "Poster",  
};

// funzione helper
function getContributo(percorso, scuola) {
  return contributi[`${percorso}|${scuola}`] || "";
}

// FETCH DATI
async function fetchResults() {
  const res = await fetch("/results-data");
  return await res.json();
}

// RENDER
function renderResults(data) {

  const container = document.getElementById("resultsContainer");
  container.innerHTML = "";

  document.getElementById("totalVotes").innerText =
    "Totale voti raccolti: " + data.totale;

  // Raggruppa per percorso
  const grouped = {};

  data.risultati.forEach(r => {
    if (!grouped[r.percorso]) grouped[r.percorso] = [];
    grouped[r.percorso].push(r);
  });

  // Per ogni percorso
  for (const percorso in grouped) {

    const elenco = grouped[percorso];

    // ordina
    elenco.sort((a,b) => b.votes - a.votes);

    const div = document.createElement("div");
    div.className = "percorso";

    const titolo = document.createElement("h2");
    titolo.innerText = percorso;
    div.appendChild(titolo);

    // PODIO
    const podio = document.createElement("div");
    podio.className = "podio";

    if (elenco[0]) {
      podio.innerHTML += `
        <div class="first">
          🥇 ${elenco[0].scuola} - ${getContributo(percorso, elenco[0].scuola)}<br>
          ${elenco[0].votes} voti
        </div>`;
    }

    if (elenco[1]) {
      podio.innerHTML += `
        <div class="second">
          🥈 ${elenco[1].scuola} - ${getContributo(percorso, elenco[1].scuola)}<br>
          ${elenco[1].votes} voti
        </div>`;
    }

    if (elenco[2]) {
      podio.innerHTML += `
        <div class="third">
          🥉 ${elenco[2].scuola} - ${getContributo(percorso, elenco[2].scuola)}<br>
          ${elenco[2].votes} voti
        </div>`;
    }

    div.appendChild(podio);

    // TABELLA
    const table = document.createElement("table");

    elenco.forEach(r => {

      const tr = document.createElement("tr");

      const td1 = document.createElement("td");
      td1.innerText = `${r.scuola} - ${getContributo(r.percorso, r.scuola)}`;

      const td2 = document.createElement("td");
      td2.innerHTML =
        `<div class="bar" style="width:${r.votes * 30}px;"></div> ${r.votes} voti`;

      tr.appendChild(td1);
      tr.appendChild(td2);

      table.appendChild(tr);
    });

    div.appendChild(table);
    container.appendChild(div);
  }
}

// AGGIORNAMENTO LIVE
async function update(){
  const data = await fetchResults();
  renderResults(data);
}

update();
setInterval(update, 2000);

</script>

</body>
</html>
