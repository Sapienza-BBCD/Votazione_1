<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Risultati in Diretta - LAB2GO</title>
<style>
body { font-family: Arial; background: #1E3A8A; color: white; margin: 0; padding: 0; }
h1 { text-align: center; padding: 20px; }
.percorso { margin: 40px auto; width: 80%; }
.percorso h2 { text-align: center; border-bottom: 2px solid white; padding-bottom: 10px; }
table { width: 100%; margin-top: 20px; border-collapse: collapse; }
td { padding: 10px; border-bottom: 1px solid white; }
.bar { background: #60A5FA; height: 20px; display: inline-block; }
</style>
</head>
<body>

<h1>Risultati in Diretta - LAB2GO</h1>
<div id="totalVotes" style="text-align:center; font-size:20px; margin-bottom:20px;">Totale voti raccolti: 0</div>

<div id="resultsContainer"></div>

<script>
async function fetchResults() {
    const res = await fetch("/result-data.html"); // richiama la pagina dei dati
    const text = await res.text();
    const results = JSON.parse(text.match(/{[\s\S]*}/)[0]); // estrae JSON dal <pre>
    return results;
}

function renderResults(results) {
    const container = document.getElementById("resultsContainer");
    container.innerHTML = "";

    let totalVotes = 0;
    for (const percorso in results) {
        const percorsoDiv = document.createElement("div");
        percorsoDiv.className = "percorso";

        const titolo = document.createElement("h2");
        titolo.textContent = percorso;
        percorsoDiv.appendChild(titolo);

        const table = document.createElement("table");

        for (const scuola in results[percorso]) {
            const voto = results[percorso][scuola];
            totalVotes += voto;

            const tr = document.createElement("tr");
            const tdScuola = document.createElement("td");
            tdScuola.textContent = scuola;
            const tdBar = document.createElement("td");
            tdBar.innerHTML = `<div class="bar" style="width:${voto*20}px;"></div> ${voto} voti`;

            tr.appendChild(tdScuola);
            tr.appendChild(tdBar);
            table.appendChild(tr);
        }

        percorsoDiv.appendChild(table);
        container.appendChild(percorsoDiv);
    }

    document.getElementById("totalVotes").textContent = `Totale voti raccolti: ${totalVotes}`;
}

// Aggiornamento automatico ogni 3 secondi
async function update() {
    const results = await fetchResults();
    renderResults(results);
}
update();
setInterval(update, 3000);
</script>

</body>
</html>
