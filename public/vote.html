<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Vota il progetto preferito. Vota fino a 2 progetti (percorsi diversi) - LAB2GO</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #e6f0ff;
  margin: 0;
  text-align: center;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #fff;
  display: flex;
  justify-content: space-between;
  padding: 10px 20px;
  z-index: 1000;
}

.logo { height: 60px; }

.separator {
  position: fixed;
  top: 80px;
  width: 100%;
  height: 6px;
  background: #e0e0e0;
}

.container {
  max-width: 1000px;
  margin: 140px auto 30px;
}

.scuola {
  color: #822433;      /* bordeaux */
  font-size: 20px;
  font-weight: bold;
}

.titolo {
  color: #822433;      /* bordeaux */
  font-size: 18px;
  font-style: italic;
}

h1 { color: #822433; }

.percorso {
  border-radius: 10px;
  margin-bottom: 30px;
  padding: 15px;
  color: #fff;
}

.table-container {
  background: white;
  border-radius: 8px;
  padding: 10px;
}
.scuola {
  color: #822433;      /* bordeaux */
  font-size: 19px;
  font-weight: bold;
}

.titolo {
  color: #822433;      /* bordeaux */
  font-size: 17px;
  font-style: italic;
}
     
table { width: 100%; }

td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  color: #222;
  font-weight: bold;
}

button {
  margin-top: 25px;
  padding: 14px 40px;
  font-size: 20px;
  font-weight: bold;
  background: linear-gradient(135deg, #822433, #a83244);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 14px rgba(0,0,0,0.3);
}

/* MODALE */
#confirmBox {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.3);
  backdrop-filter: blur(4px);
  justify-content:center;
  align-items:center;
  z-index:2000;
  backdrop-filter: blur(3px);
}
.table-container {
  background: white;
}
#confirmInner {
  background:#1f2937;
  padding:20px;
  border-radius:10px;
  width:80%;
  max-width:500px;
  color:white;
}
</style>
</head>

<body>

<header>
  <img src="logo1.png" class="logo">
  <img src="logo2.png" class="logo">
</header>

<div class="separator"></div>

<div class="container">
<h1>Vota il progetto preferito - LAB2GO. Vota fino a 2 progetti (percorsi diversi)</h1>
<div id="voteContainer"></div>
</div>

<!-- MODALE -->
<div id="confirmBox">
  <div id="confirmInner">
    <h2>Conferma voto</h2>
    <div id="confirmText"></div>

    <br>

    <button onclick="sendVotes()" style="background:green;">Conferma</button>
    <button onclick="closeConfirm()" style="background:red;">Annulla</button>
  </div>
</div>

<script>

const percorsi = {

  "Biologia Vegetale - Esperimento": [
    { nome: "ITA G. Garibaldi Roma", titolo: "Filiera Mais No-OGM (PCR)" },
    { nome: "ITA Garibaldi Roma + Liceo Righi Roma", titolo: "Tiny Forest e suolo" }
  ],
  
  "Fisica - Esperimento": [
    { nome: "Gaetano De Sanctis", titolo: "Sensori, Motori e Gravità" },
    { nome: "G. Lombardo Radice", titolo: "Ipnosi dei pendoli magici" },
    { nome: "G. Lombardo Radice", titolo: "Tubo di Quincke" },
    { nome: "G. Lombardo Radice", titolo: "Polarizzazione della luce" },
    { nome: "Augusto Righi Roma", titolo: "Sensore ultrasuoni HC SR04" },
    { nome: "Vittoria Colonna", titolo: "Il pendolo nella storia" },
    { nome: "Pilo Albertelli Roma", titolo: "Il coherer e onde elettromagnetiche" },
    { nome: "Flacco Potenza", titolo: "Diffrazione ottica" }
  ],

  "Chimica - Esperimento": [
    { nome: "Terenzio Mamiani", titolo: "Chimica e sostenibilità" },
    { nome: "Cavour", titolo: "Pigmenti, gas ed elettrochimica" },
    { nome: "Pertini Falcone", titolo: "Percorsi di chimica sperimentale" }
  ],

  "Biologia Animale - Poster": [
    { nome: "Livia Bottardi", titolo: "Cellule al microscopio" }
  ],
  
  "Biologia Vegetale - Poster": [
    { nome: "Augusto Righi Roma", titolo: "Tiny Forest metagenomica" },
    { nome: "Augusto Righi Roma", titolo: "Analisi Tiny Forest" }
  ],

  "Chimica - Poster": [
    { nome: "Cavour", titolo: "Pigmenti e acidità" },
    { nome: "Evangelista Torricelli", titolo: "Chimica quotidiana" },
    { nome: "IT Agrario Giuseppe Garibaldi", titolo: "Produzione metano (BMT)" }
  ],

  "Fisica - Poster": [
    { nome: "Vian Bracciano", titolo: "Legge di Lambert-Beer" },
    { nome: "Gaetano De Sanctis", titolo: "Meccanica con Arduino" },
    { nome: "Nomentano", titolo: "Muoni e raggi cosmici" },
    { nome: "G. Lombardo Radice", titolo: "Onde che si incontrano" },
    { nome: "Polo Liceale Alighieri", titolo: "Virgo e onde gravitazionali" },
    { nome: "Polo Liceale Alighieri", titolo: "Limite di Heisenberg" },
    { nome: "Vittoria Colonna", titolo: "Il pendolo nella storia" },
    { nome: "Flacco Potenza", titolo: "Biomeccanica leve" }
  ],
  
  "Musei Scientifici - Poster": [
    { nome: "Massimiliano Massimo", titolo: "Museo scientifico" },
    { nome: "Pertini Falcone", titolo: "Museo via Rugantino" }
  ],

  "Scienze della Terra - Poster": [
    { nome: "Labriola", titolo: "Esperienza Lab2Go" },
    { nome: "Galileo Galilei Roma", titolo: "Rocce, minerali e paesaggi" }
  ],

  "Biologia Animale - Talk": [
    { nome: "J.M. Keynes", titolo: "Dal procariote all’eucariote" },
    { nome: "Socrate Roma", titolo: "Ricostruzione 3D" }
  ],

  "Biologia Vegetale - Talk": [
    { nome: "ITA Garibaldi Roma", titolo: "Tiny Forest avanzata" },
    { nome: "J.V. Neumann", titolo: "Viroma piante urbane" },
    { nome: "Tullio Levi Civita", titolo: "Laboratorio botanica" },
    { nome: "Pertini Falcone", titolo: "Laboratori biologia vegetale" }
  ],

  "Fisica - Talk": [
    { nome: "G. Lombardo Radice", titolo: "Punto luminoso di Poisson" },
    { nome: "Polo Liceale Alighieri", titolo: "Vuoto e incertezza" }
  ],

  "Chimica - Talk": [
    { nome: "Liceo Terenzio Mamiani", titolo: "Chimica e sostenibilità" },
    { nome: "Liceo Scientifico Cavour", titolo: "Pigmenti e acidità" },
    { nome: "Evangelista Torricelli", titolo: "Chimica quotidiana" }
  ]
};

// =========================
// TOKEN
// =========================
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");

if (!token) {
  document.body.innerHTML = "<h2>Accesso non valido: usa il QR code</h2>";
  throw new Error("Token mancante");
}

// =========================
// CONFIG
// =========================
const MAX_VOTES = 2;

// prende la disciplina (Fisica, Chimica, ecc.)
function getDisciplina(percorso) {
  return percorso.split(" - ")[0];
}

// =========================
//UI
// =========================
const voteContainer = document.getElementById("voteContainer");
Object.keys(percorsi).sort().forEach(percorso => {
    const div = document.createElement("div");
    div.className = "percorso";
    div.style.background = "#f8fafc";
    div.style.color = "#111";
    const h2 = document.createElement("h2");
    h2.innerText = percorso; div.appendChild(h2);
    const table = document.createElement("table");

percorsi[percorso].forEach(item => {
  const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="scuola">${item.nome}</td>
      <td class="titolo">${item.titolo}</td>
      <td><input type="checkbox" name="choice" value="${percorso}|${item.nome}"></td>
`   ;

  table.appendChild(tr);
});
       
    div.appendChild(table);
    voteContainer.appendChild(div);
});

// =========================
// BLOCCO MAX 2 SELEZIONI (FIX BUG)
// =========================
document.addEventListener("change", (e) => {
  if (e.target.name === "choice") {

    const checked = document.querySelectorAll("input[name='choice']:checked");

    if (checked.length > MAX_VOTES) {
      e.target.checked = false;
      alert("Puoi selezionare massimo 2 progetti");
    }
  }
});

// =========================
// FORM
// =========================
const form = document.createElement("form");

form.innerHTML = `<button type="submit">✅ Invia voto</button>`;
form.style.marginTop = "30px";

// IMPORTANTISSIMO: mettilo fuori dalle card, non dentro voteContainer
document.querySelector(".container").appendChild(form);

// =========================
// SUBMIT VOTO (APRE MODALE)
// =========================

form.addEventListener("submit", (e) => {
  e.preventDefault();

  const checked = document.querySelectorAll("input[name='choice']:checked");

  if (checked.length === 0) {
    alert("Seleziona almeno un progetto");
    return;
  }

  if (checked.length > MAX_VOTES) {
    alert("Massimo 2 voti");
    return;
  }

  const discipline = Array.from(checked).map(c =>
    getDisciplina(c.value.split("|")[0])
  );

  const uniche = new Set(discipline);

  if (checked.length === 2 && uniche.size === 1) {
    alert("Devi scegliere due discipline diverse");
    checked[checked.length - 1].checked = false;
    return;
  }

  openConfirm(checked);
});

function openConfirm(checked) {
  const confirmBox = document.getElementById("confirmBox");
  const confirmText = document.getElementById("confirmText");

  confirmText.innerHTML = "";

  checked.forEach(c => {
    const [percorso, scuola] = c.value.split("|");

    const p = document.createElement("p");
    p.innerText = `${percorso} → ${scuola}`;
    confirmText.appendChild(p);
  });

  confirmBox.style.display = "flex";
}

function closeConfirm() {
  document.getElementById("confirmBox").style.display = "none";
}
async function sendVotes() {

  const checked = document.querySelectorAll("input[name='choice']:checked");

  for (let scelta of checked) {

    const [percorso, scuola] = scelta.value.split("|");

    try {
      const res = await fetch("/vote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, percorso, scuola })
      });

      const data = await res.json();

      if (!data.success) {
        alert(data.error || "Errore durante il voto");
        return;
      }

    } catch (err) {
      alert("Errore di connessione al server");
      return;
    }
  }

  alert("Voto registrato con successo!");

  document.querySelectorAll("input[name='choice']")
    .forEach(c => c.checked = false);

  closeConfirm();
}

</script>
</body>
</html>
