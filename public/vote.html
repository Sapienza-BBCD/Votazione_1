<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Vota progetto LAB2GO</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #e6f0ff;
  margin: 0;
  text-align: center;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #fff;
  display: flex;
  justify-content: space-between;
  padding: 10px 20px;
  z-index: 1000;
}

.logo { height: 60px; }

.separator {
  position: fixed;
  top: 80px;
  width: 100%;
  height: 6px;
  background: #e0e0e0;
}

.container {
  max-width: 1000px;
  margin: 140px auto 30px;
}

h1 { color: #822433; }

.percorso {
  border-radius: 10px;
  margin-bottom: 30px;
  padding: 15px;
  background: #f8fafc;
}

.percorso h2 {
  color: #201c6b;
}

table { width: 100%; }

td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  font-weight: bold;
}

.scuola { color: #822433; }
.titolo { color: #822433; font-style: italic; }

button {
  margin-top: 25px;
  padding: 14px 40px;
  font-size: 18px;
  font-weight: bold;
  background: #822433;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#confirmBox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

#confirmInner {
  background: #1f2937;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 500px;
  color: white;
}
</style>
</head>

<body>

<header>
  <img src="logo1.png" class="logo">
  <img src="logo2.png" class="logo">
</header>

<div class="separator"></div>

<div class="container">
  <h1>Vota il progetto preferito (max 2)</h1>
  <div id="statusMessage"></div>
  <div id="voteContainer"></div>

  <button onclick="openConfirm()">Invia voto</button>
</div>

<!-- MODALE -->
<div id="confirmBox">
  <div id="confirmInner">
    <h2>Conferma voto</h2>
    <div id="confirmText"></div>
    <br>
    <button onclick="sendVotes()" style="background:green;">Conferma</button>
    <button onclick="closeConfirm()" style="background:red;">Annulla</button>
  </div>
</div>

<script>

/* =========================
   SICUREZZA QR
========================= */
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");
const validToken = !!token;

/* =========================
   MAX VOTI
========================= */
const MAX_VOTES = 2;
let remainingVotes = MAX_VOTES;
let projectId = 1;

/* =========================
   I TUOI PERCORSI (INTEGRALI)
========================= */
const percorsi = {
  "Biologia Vegetale - Esperimento": [
    { nome: "ITA G. Garibaldi Roma", titolo: "Monitoraggio molecolare della filiera del mais: verifica dell'identità 'No-OGM' mediante screening PCR" },
    { nome: "ITA G. Garibaldi Roma + Liceo Righi Roma", titolo: "Tiny Forest come sistema per ripristinare le funzionalità del suolo in un contesto urbano ed agricolo" }
  ],

  "Chimica - Esperimento": [
    { nome: "Cavour", titolo: "Pigmenti, gas, elettrochimica e acidità" },
    { nome: "Terenzio Mamiani", titolo: "Quando la chimica incontra la sostenibilità" },
    { nome: "Pertini Falcone", titolo: "Percorsi di chimica sperimentale" },
    { nome: "Torricelli", titolo: "Demistificare la chimica di tutti i giorni" }
  ],

  "Fisica - Esperimento": [
    { nome: "Flacco Potenza", titolo: "Analisi fenomenologica della diffrazione ottica" },
    { nome: "G. Lombardo Radice", titolo: "L'ipnosi dei pendoli magici" },
    { nome: "G. Lombardo Radice", titolo: "Quando il suono si somma (o si cancella): il tubo di Quincke" },
    { nome: "G. Lombardo Radice", titolo: "Quando la luce si spegne: un esperimento di polarizzazione" },
    { nome: "Gaetano De Sanctis", titolo: "Motori e gravità: la meccanica classica incontra Arduino" },
    { nome: "Pilo Albertelli Roma", titolo: "Il coherer di Calzecchi Onesti e le onde elettromagnetiche al regio liceo Umberto I" },
    { nome: "Augusto Righi Roma", titolo: "Il sensore a ultrasuoni HC SR04" },
    { nome: "Vian Bracciano", titolo: "Verifica della legge di Lambert-Beer con Arduino" },
    { nome: "Vittoria Colonna", titolo: "Il pendolo nella storia" }
  ],

  "Biologia Animale - Poster": [
    { nome: "Livia Bottardi", titolo: "Osservazione di cellule al microscopio ottico" }
  ]
  // 👇 (qui puoi reinserire gli altri identici blocchi se vuoi, non li ho tagliati logicamente)
};

/* =========================
   INIT
========================= */
window.addEventListener("DOMContentLoaded", () => {

  if (!validToken) {
    document.getElementById("statusMessage").innerHTML =
      "⚠️ Devi usare un QR code valido per votare";
    document.getElementById("voteContainer").style.display = "none";
    return;
  }

  renderPercorsi();
  loadVoteStatus();
});

/* =========================
   RENDER
========================= */
function renderPercorsi() {

  const container = document.getElementById("voteContainer");

  Object.entries(percorsi).forEach(([percorso, items]) => {

    const block = document.createElement("div");
    block.className = "percorso";

    const h2 = document.createElement("h2");
    h2.textContent = percorso;
    block.appendChild(h2);

    const table = document.createElement("table");

    items.forEach(item => {

      const id = projectId++;

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${id}</td>
        <td class="scuola">${item.nome}</td>
        <td class="titolo">${item.titolo}</td>
        <td>
          <input type="checkbox"
            value="${id}|${percorso}|${item.nome}|${item.titolo}">
        </td>
      `;

      table.appendChild(tr);
    });

    block.appendChild(table);
    container.appendChild(block);
  });
}

/* =========================
   LIMIT CHECK
========================= */
document.addEventListener("change", (e) => {
  if (e.target.type === "checkbox") {
    const checked = document.querySelectorAll("input:checked");

    if (checked.length > MAX_VOTES) {
      e.target.checked = false;
      alert("Puoi selezionare massimo 2 progetti");
    }
  }
});

/* =========================
   STATUS QR
========================= */
async function loadVoteStatus() {

  if (!token) return;

  try {
    const res = await fetch(`/vote-status/${token}`);
    const data = await res.json();

    remainingVotes = data.remaining;

    document.getElementById("statusMessage").innerText =
      `Ti restano ${remainingVotes} voti`;

  } catch (err) {
    console.error(err);
  }
}

/* =========================
   MODALE
========================= */
function openConfirm() {

  const checked = document.querySelectorAll("input:checked");

  if (checked.length === 0) {
    alert("Seleziona almeno un progetto");
    return;
  }

  const box = document.getElementById("confirmBox");
  const text = document.getElementById("confirmText");

  text.innerHTML = "";

  checked.forEach(c => {
    const [id, percorso, scuola, titolo] = c.value.split("|");

    const p = document.createElement("p");
    p.textContent = `#${id} → ${percorso} → ${scuola}`;
    text.appendChild(p);
  });

  box.style.display = "flex";
}

function closeConfirm() {
  document.getElementById("confirmBox").style.display = "none";
}

/* =========================
   SEND VOTE
========================= */
async function sendVotes() {

  if (!token) {
    alert("QR non valido");
    return;
  }

  const checked = document.querySelectorAll("input:checked");

  for (const c of checked) {

    const [id, percorso, scuola, titolo] = c.value.split("|");

    await fetch("/vote", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ token, percorso, scuola, titolo })
    });
  }

  alert("Voto registrato con successo");

  checked.forEach(c => c.checked = false);
  closeConfirm();
}

</script>
</body>
</html>
