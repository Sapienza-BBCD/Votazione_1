<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Votazione LAB2GO</title>

<style>
body {
  font-family: Arial;
  background: #e6f0ff;
  margin: 0;
  text-align: center;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #fff;
  display: flex;
  justify-content: space-between;
  padding: 10px 20px;
}

.logo { height: 60px; }

.separator {
  position: fixed;
  top: 80px;
  width: 100%;
  height: 6px;
  background: #e0e0e0;
}

.container {
  margin-top: 140px;
  max-width: 1100px;
  margin-left: auto;
  margin-right: auto;
}

h1 { color: #822433; }

.percorso {
  background: #f8fafc;
  margin: 20px 0;
  padding: 15px;
  border-radius: 10px;
}

.percorso h2 { color: #201c6b; }

table { width: 100%; }

td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  font-weight: bold;
}

.scuola { color: #822433; }
.titolo { color: #822433; font-style: italic; }

button {
  margin-top: 20px;
  padding: 12px 30px;
  font-size: 18px;
  background: #822433;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

/* MODALE */
#confirmBox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  justify-content: center;
  align-items: center;
}

#confirmInner {
  background: #1f2937;
  color: white;
  padding: 20px;
  border-radius: 10px;
  max-width: 500px;
}
</style>
</head>

<body>

<header>
  <img src="logo1.png" class="logo">
  <img src="logo2.png" class="logo">
</header>

<div class="separator"></div>

<div class="container">
  <h1>Vota il progetto (max 2)</h1>

  <div id="status"></div>
  <div id="voteContainer"></div>

  <button onclick="openConfirm()">Invia voto</button>
</div>

<!-- MODALE -->
<div id="confirmBox">
  <div id="confirmInner">
    <h2>Conferma voto</h2>
    <div id="confirmText"></div>
    <br>
    <button onclick="sendVotes()" style="background:green;">Conferma</button>
    <button onclick="closeConfirm()" style="background:red;">Annulla</button>
  </div>
</div>

<script>

/* =========================
   TUOI PERCORSI (INTEGRI)
========================= */

    { nome: "ITA G. Garibaldi Roma + Liceo Righi Roma", titolo: "Tiny Forest come sistema per ripristinare le funzionalità del suolo in un contesto urbano ed agricolo" }
  ],
  "Chimica - Esperimento": [
    { nome: "Cavour", titolo: "Pigmenti, gas, elettrochimica e acidità" },
    { nome: "Terenzio Mamiani", titolo: "Quando la chimica incontra la sostenibilità" },
    { nome: "Pertini Falcone", titolo: "Percorsi di chimica sperimentale" },
    { nome: "Torricelli", titolo: "Demistificare la chimica di tutti i giorni" }
  ],
  "Fisica - Esperimento": [
    { nome: "Flacco Potenza", titolo: "Analisi fenomenologica della diffrazione ottica" },
    { nome: "G. Lombardo Radice", titolo: "L'ipnosi dei pendoli magici" },
    { nome: "G. Lombardo Radice", titolo: "Quando il suono si somma (o si cancella): il tubo di Quincke" },
    { nome: "G. Lombardo Radice", titolo: "Quando la luce si spegne: un esperimento di polarizzazione" },
    { nome: "Gaetano De Sanctis", titolo: "Motori e gravità: la meccanica classica incontra Arduino" },
    { nome: "Pilo Albertelli Roma", titolo: "Il coherer di Calzecchi Onesti e le onde elettromagnetiche al regio liceo Umberto I" },
    { nome: "Augusto Righi Roma", titolo: "Il sensore a ultrasuoni HC SR04" },
    { nome: "Vian Bracciano", titolo: "Verifica della legge di Lambert-Beer con Arduino" },
    { nome: "Vittoria Colonna", titolo: "Il pendolo nella storia" }
  ],
  "Biologia Animale - Poster": [
    { nome: "Livia Bottardi", titolo: "Osservazione di cellule al microscopio ottico" }
  ],
  "Biologia Vegetale - Poster": [
    { nome: "Augusto Righi Roma", titolo: "Progettazione e analisi metagenomica di una Tiny Forest" },
    { nome: "Augusto Righi Roma", titolo: "Progettazione e analisi metagenomica di una Tiny Forest: un approccio integrato tra agronomia, sostenibilità e sequenziamento di terza generazione" }
  ],
  "Chimica - Poster": [
    { nome: "Cavour", titolo: "Pigmenti, gas, elettrochimica e acidità" },
    { nome: "Garibaldi", titolo: "Determinazione del potenziale biochimico di produzione di metano (BMT test) su matrici organiche di scarto" },
    { nome: "Evangelista Torricelli", titolo: "Demistificare la chimica di tutti i giorni" }
  ],
  "Fisica - Poster": [
    { nome: "Flacco Potenza", titolo: "Analisi biomeccanica delle leve nel corpo umano" },
    { nome: "Gaetano De Sanctis", titolo: "Sensori, motori e gravità: la meccanica incontra Arduino" },
    { nome: "Nomentano", titolo: "La pioggia celeste di Muoni: da Poisson allo studio dei raggi cosmici" },
    { nome: "G. Lombardo Radice", titolo: "Quando le onde che si incontrano... e la fisica si diverte a giocare!" },
    { nome: "Polo Liceale Alighieri - Dante Alighieri", titolo: "Virgo: sulle tracce dell'invisibile ritmo dell'Universo" },
    { nome: "Polo Liceale Alighieri - Dante Alighieri", titolo: "Oltre il limite di Heisenberg: schiacciare il vuoto quantistico" },
    { nome: "Vittoria Colonna", titolo: "Il pendolo nella storia" },
    { nome: "Vian Bracciano", titolo: "Verifica della legge di Lambert-Beer con Arduino" }
  ],
  "Musei Scientifici - Poster": [
    { nome: "Massimiliano Massimo", titolo: "Museo scientifico" },
    { nome: "Pertini Falcone", titolo: "Museo via Rugantino" }
  ],
  "Scienze della Terra - Poster": [
    { nome: "Labriola", titolo: "Esperienza Lab2Go del Liceo Labriola" },
    { nome: "Galileo Galilei Roma", titolo: "Dall'osservazione alla scopperta: studio di rocce, minerali e paesaggi" }
  ],
  "Biologia Animale - Talk": [
    { nome: "J.M. Keynes", titolo: "Il mondo dietro il microscopio" },
    { nome: "Socrate Roma", titolo: "Dal reperto alla ricostruzione 3D" }
  ],
  "Biologia Vegetale - Talk": [
    { nome: "ITA Garibaldi Roma", titolo: "Tiny Forest metagenomica" },
    { nome: "J.V. Neumann", titolo: "Viroma urbano" },
    { nome: "Pertini Falcone", titolo: "Laboratori biologia vegetale" },
    { nome: "Tullio Levi Civita", titolo: "Laboratorio di botanica" }
  ],
  "Fisica - Talk": [
    { nome: "G. Lombardo Radice", titolo: "Poisson e luce" },
    { nome: "Polo Liceale Alighieri", titolo: "Vuoto e incertezza" }
  ],
  "Chimica - Talk": [
    { nome: "Cavour", titolo: "Chimica sperimentale" },
    { nome: "Garibaldi", titolo: "BMT test" },
    { nome: "Terenzio Mamiani", titolo: "Sostenibilità" },
    { nome: "Evangelista Torricelli", titolo: "Chimica quotidiana" }
  ]
};

const MAX_VOTES = 2;
let projectId = 1;

/* =========================
   RENDER
========================= */

window.addEventListener("DOMContentLoaded", () => {

  const container = document.getElementById("voteContainer");

  Object.entries(percorsi).forEach(([p, items]) => {

    const div = document.createElement("div");
    div.className = "percorso";

    const h2 = document.createElement("h2");
    h2.textContent = p;
    div.appendChild(h2);

    const table = document.createElement("table");

    items.forEach(i => {

      const id = projectId++;

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${id}</td>
        <td class="scuola">${i.nome}</td>
        <td class="titolo">${i.titolo}</td>
        <td>
          <input type="checkbox" name="vote"
            value="${id}|${p}|${i.nome}|${i.titolo}">
        </td>
      `;

      table.appendChild(tr);
    });

    div.appendChild(table);
    container.appendChild(div);
  });
});

/* =========================
   LIMIT 2 VOTI
========================= */

document.addEventListener("change", (e) => {

  if (e.target.name === "vote") {

    const checked = document.querySelectorAll("input[name='vote']:checked");

    if (checked.length > MAX_VOTES) {
      e.target.checked = false;
      alert("Max 2 voti");
    }
  }
});

/* =========================
   MODALE
========================= */

function openConfirm() {

  const checked = document.querySelectorAll("input[name='vote']:checked");

  if (checked.length === 0) return;

  const box = document.getElementById("confirmBox");
  const text = document.getElementById("confirmText");

  text.innerHTML = "";

  checked.forEach(c => {
    const [id, p, s, t] = c.value.split("|");
    text.innerHTML += `<p>#${id} → ${p} → ${s}</p>`;
  });

  box.style.display = "flex";
}

function closeConfirm() {
  document.getElementById("confirmBox").style.display = "none";
}

/* =========================
   SEND (placeholder backend)
========================= */

async function sendVotes() {
  alert("Voto inviato (collega backend)");
  closeConfirm();
}

</script>

</body>
</html>
