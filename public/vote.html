<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Vota il progetto preferito - LAB2GO</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #e6f0ff;
  margin: 0;
  text-align: center;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #fff;
  display: flex;
  justify-content: space-between;
  padding: 10px 20px;
  z-index: 1000;
}

.logo { height: 60px; }

.separator {
  position: fixed;
  top: 80px;
  width: 100%;
  height: 6px;
  background: #e0e0e0;
}

.container {
  max-width: 1000px;
  margin: 140px auto 30px;
}

h1 { color: #822433; }

.percorso {
  border-radius: 10px;
  margin-bottom: 30px;
  padding: 15px;
  color: #fff;
}

.table-container {
  background: #ffffffcc;
  border-radius: 8px;
  padding: 10px;
}

table { width: 100%; }

td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  color: #800000;
  font-weight: bold;
}

button {
  margin-top: 20px;
  padding: 12px 30px;
  font-size: 18px;
  background: #007BFF;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

/* 🔥 MODALE CONFERMA */
#confirmBox {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
  z-index:2000;
}

#confirmInner {
  background:#1f2937;
  padding:20px;
  border-radius:10px;
  width:80%;
  max-width:500px;
  color:white;
}
</style>
</head>

<body>

<header>
  <img src="logo1.png" class="logo">
  <img src="logo2.png" class="logo">
</header>

<div class="separator"></div>

<div class="container">
<h1>Vota il progetto preferito - LAB2GO</h1>
<div id="voteContainer"></div>
</div>

<!-- 🔥 MODALE CONFERMA -->
<div id="confirmBox">
  <div id="confirmInner">
    <h2>Conferma voto</h2>
    <div id="confirmText"></div>

    <br>

    <button onclick="sendVotes()" style="background:green;">
      Conferma
    </button>

    <button onclick="closeConfirm()" style="background:red;">
      Annulla
    </button>
  </div>
</div>

<script>

// =========================
// DATI
// =========================
const percorsi = {
"Fisica - Esperimento": [
  { nome: "Gaetano De Sanctis", titolo: "Sensori, Motori e Gravità" },
  { nome: "G. Lombardo Radice", titolo: "Ipnosi dei pendoli magici" },
  { nome: "G. Lombardo Radice", titolo: "Tubo di Quincke" },
  { nome: "G. Lombardo Radice", titolo: "Polarizzazione della luce" },
  { nome: "Augusto Righi Roma", titolo: "Sensore ultrasuoni HC SR04" },
  { nome: "Vittoria Colonna", titolo: "Il pendolo nella storia" },
  { nome: "Pilo Albertelli Roma", titolo: "Il coherer e onde elettromagnetiche" },
  { nome: "Flacco Potenza", titolo: "Diffrazione ottica" }
],

"Chimica - Esperimento": [
  { nome: "Terenzio Mamiani", titolo: "Chimica e sostenibilità" },
  { nome: "Cavour", titolo: "Pigmenti, gas ed elettrochimica" },
  { nome: "Pertini Falcone", titolo: "Percorsi di chimica sperimentale" }
]
};

// =========================
const token = new URLSearchParams(window.location.search).get("token");
const MAX_VOTES = 2;

let votiSelezionati = [];

// =========================
// UI CREATION
// =========================
const voteContainer = document.getElementById("voteContainer");

Object.keys(percorsi).sort().forEach(percorso => {

  const div = document.createElement("div");
  div.className = "percorso";
  div.style.background = "#3b82f6";

  const h2 = document.createElement("h2");
  h2.innerText = percorso;
  div.appendChild(h2);

  const tableDiv = document.createElement("div");
  tableDiv.className = "table-container";

  const table = document.createElement("table");

  percorsi[percorso].forEach(item => {

    const tr = document.createElement("tr");

    const tdNome = document.createElement("td");
    tdNome.innerText = item.nome;

    const tdTitolo = document.createElement("td");
    tdTitolo.innerText = item.titolo;

    const tdCheck = document.createElement("td");
    const input = document.createElement("input");

    input.type = "checkbox";
    input.name = "choice";
    input.value = `${percorso}|${item.nome}`;

    tdCheck.appendChild(input);

    tr.appendChild(tdNome);
    tr.appendChild(tdTitolo);
    tr.appendChild(tdCheck);

    table.appendChild(tr);
  });

  tableDiv.appendChild(table);
  div.appendChild(tableDiv);
  voteContainer.appendChild(div);
});

// =========================
// FORM
// =========================
const form = document.createElement("form");

const submit = document.createElement("button");
submit.innerText = "Invia voto";

form.appendChild(submit);
voteContainer.appendChild(form);

// =========================
// SUBMIT → SOLO CONFERMA
// =========================
form.addEventListener("submit", (e) => {

  e.preventDefault();

  const checked = document.querySelectorAll("input[name='choice']:checked");

  if (checked.length === 0) {
    alert("Seleziona almeno un progetto");
    return;
  }

  if (checked.length > MAX_VOTES) {
    alert("Massimo 2 voti");
    return;
  }

  votiSelezionati = Array.from(checked).map(c => c.value);

  let text = "";

  votiSelezionati.forEach(v => {
    const [percorso, scuola] = v.split("|");
    text += `✔ ${percorso} - ${scuola}<br><br>`;
  });

  if (votiSelezionati.length === 1) {
    text += "Hai ancora un voto disponibile.";
  } else {
    text += "Hai selezionato 2 progetti. Sei sicuro?";
  }

  document.getElementById("confirmText").innerHTML = text;
  document.getElementById("confirmBox").style.display = "flex";
});

// =========================
// CHIUDI MODALE
// =========================
function closeConfirm() {
  document.getElementById("confirmBox").style.display = "none";
  votiSelezionati = [];
}

// =========================
// INVIO VERO VOTO
// =========================
async function sendVotes() {

  for (let scelta of votiSelezionati) {

    const [percorso, scuola] = scelta.split("|");

    const res = await fetch("/vote", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ token, percorso, scuola })
    });

    const data = await res.json();

    if (!data.success) {
      alert(data.error);
      return;
    }
  }

  alert("Voto registrato!");
  closeConfirm();
}

</script>

</body>
</html>
