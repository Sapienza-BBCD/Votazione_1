const token = new URLSearchParams(window.location.search).get("token");

if (!token) {
  document.body.innerHTML = "<h2 style='color:red;text-align:center'>Token mancante. Riprova dal QR.</h2>";
  throw new Error("Token mancante");
}

const MAX_VOTES = 2;

let votiSelezionati = [];

// =========================
// CREA FORM (IMPORTANTE: ora esiste davvero)
// =========================
const form = document.createElement("form");

// =========================
// SUBMIT (apre conferma, NON invia)
// =========================
form.addEventListener("submit", (e) => {

  e.preventDefault();

  const checked = document.querySelectorAll("input[name='choice']:checked");

  if (checked.length === 0) {
    alert("Seleziona almeno un progetto");
    return;
  }

  if (checked.length > MAX_VOTES) {
    alert("Massimo 2 voti");
    return;
  }

  const values = Array.from(checked).map(c => c.value);

  const unique = new Set(values);
  if (unique.size !== values.length) {
    alert("Hai selezionato duplicati");
    return;
  }

  votiSelezionati = values;

  let text = "";

  values.forEach(v => {
    const [p, s] = v.split("|");
    text += `✔ ${p} - ${s}<br><br>`;
  });

  if (values.length === 1) {
    text += "Hai ancora un voto disponibile.";
  } else {
    text += "Hai selezionato 2 progetti. Sei sicuro?";
  }

  document.getElementById("confirmText").innerHTML = text;
  document.getElementById("confirmBox").style.display = "flex";
});

// append form al DOM (IMPORTANTE)
document.getElementById("voteContainer").appendChild(form);

// =========================
// INVIO VERO VOTO
// =========================
async function sendVotes() {

  for (let scelta of votiSelezionati) {

    const [percorso, scuola] = scelta.split("|");

    const res = await fetch("/vote", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ token, percorso, scuola })
    });

    const data = await res.json();

    if (!data.success) {
      alert(data.error);
      return;
    }
  }

  alert("Voto registrato!");

  document.querySelectorAll("input[name='choice']")
    .forEach(c => c.checked = false);

  votiSelezionati = [];
  closeConfirm();
}

// =========================
// CHIUDI MODALE
// =========================
function closeConfirm() {
  document.getElementById("confirmBox").style.display = "none";
}

</script>
