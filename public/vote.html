<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<style>
body {

}

.logo { height: 60px; }

.separator {
  position: fixed;
  top: 80px;
  width: 100%;

}

.container {
  max-width: 1000px;
  margin: 140px auto 30px;
}

.scuola {
  color: #822433;      /* bordeaux */

}

.titolo {
  color: #822433;      /* bordeaux */

  font-style: italic;
}

h1 { color: #822433; }

.percorso {
  border-radius: 10px;
  margin-bottom: 30px;

}

  background: white;
  border-radius: 8px;
  padding: 10px;
}
.scuola {
  color: #822433;      /* bordeaux */
  font-size: 19px;
  font-weight: bold;
}

.titolo {
  color: #822433;      /* bordeaux */
  font-size: 17px;

}

#statusMessage {
  margin: 20px auto;
  padding: 15px;

  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}

.warning {
  background: #fff3cd;
  color: #856404;
  border: 2px solid #ffeaa7;
}

.success {
  background: #d4edda;
  color: #155724;
  border: 2px solid #a5d6a7;
}
     
table { width: 100%; }

td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  color: #222;
  font-weight: bold;
}

button {
  margin-top: 25px;
  padding: 14px 40px;
  font-size: 20px;
  font-weight: bold;
  background: linear-gradient(135deg, #822433, #a83244);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 14px rgba(0,0,0,0.3);
}

/* MODALE */
#confirmBox {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.3);
  backdrop-filter: blur(4px);
  justify-content:center;
  align-items:center;
  z-index:2000;
  
}
.table-container {
  background: white;
}
#confirmInner {
  background:#1f2937;
  padding:20px;
  border-radius:10px;
  width:80%;
  max-width:500px;
  color:white;
}
</style>
</head>

<body>

<header>
  <img src="logo1.png" class="logo">
  <img src="logo2.png" class="logo">
</header>

<div class="separator"></div>

<div class="container">
<h1>Vota il progetto preferito - LAB2GO. Vota fino a 2 progetti (percorsi diversi)</h1>
<div id="statusMessage"></div>

<div id="voteContainer"></div>
</div>

<!-- MODALE -->
<div id="confirmBox">
  <div id="confirmInner">
    <h2>Conferma voto</h2>
    <div id="confirmText"></div>

    <br>

    <button onclick="sendVotes()" style="background:green;">Conferma</button>
    <button onclick="closeConfirm()" style="background:red;">Annulla</button>
  </div>
</div>

<script>

const percorsi = {

  "Biologia Vegetale - Esperimento": [
    { nome: "ITA G. Garibaldi Roma", titolo: "Monitoraggio molecolare della filiera del mais: verifica dell'identità 'No-OGM' mediante screening PCR" },
    { nome: "ITA Garibaldi Roma + Liceo Righi Roma", titolo: "Tiny Forest come sistema per ripristinare le funzionalità del suolo in un contesto urbano ed agricolo" }
  ],
  

  "Chimica - Esperimento": [
    { nome: "Terenzio Mamiani", titolo: "Quando la chimica incontra la sostenibilità" },
    { nome: "Cavour", titolo: "Pigmenti, gas, elettrochimica e acidità" },
    { nome: "Pertini Falcone", titolo: "Percorsi di chimica sperimentale" },
    { nome: "PTorricelli", titolo: "Demistificare la chimica di tutti i giorni" }
  ],

  "Fisica - Esperimento": [
    { nome: "Gaetano De Sanctis", titolo: "Motori e gravità: la meccanica classica incontra Arduino" },
    { nome: "G. Lombardo Radice", titolo: "L'ipnosi dei pendoli magici" },
    { nome: "G. Lombardo Radice", titolo: "Quando il suono si somma (o si cancella): il tubo di Quincke" },
    { nome: "G. Lombardo Radice", titolo: "Quando la luce si spegne: un esperimento di polarizzazione" },
    { nome: "Augusto Righi Roma", titolo: "Il sensore a ultrasuoni HC SR04" },
    { nome: "Vittoria Colonna", titolo: "Il pendolo nella storia" },
    { nome: "Pilo Albertelli Roma", titolo: "Il coherer di Calzecchi Onesti e le onde elettromagnetiche al regio liceo Umberto I" },
    { nome: "Vian Bracciano", titolo: "Verifica della legge di Lambert-Beer con Arduino" },
    { nome: "Flacco Potenza", titolo: "Analisi fenomenologica della diffrazione ottica" }
  ],


  "Biologia Animale - Poster": [
    { nome: "Livia Bottardi", titolo: "Osservazione di cellule al microscopio ottico" }
  ],
  
  "Biologia Vegetale - Poster": [
    { nome: "Augusto Righi Roma", titolo: "Progettazione e analisi metagenomica di una Tiny Forest" },
    { nome: "Augusto Righi Roma", titolo: "Progettazione e analisi metagenomica di una Tiny Forest: un approccio integrato tra agronomia, sostenibilità e sequenziamento di terza generazione" }
  ],

  "Chimica - Poster": [
    { nome: "Cavour", titolo: "Pigmenti, gas, elettrochimica e acidità" },
    { nome: "Evangelista Torricelli", titolo: "Demistificare la chimica di tutti i giorni" }
 ],

  "Fisica - Poster": [
    { nome: "Vian Bracciano", titolo: "Verifica della legge di Lambert-Beer con Arduino" },
    { nome: "Gaetano De Sanctis", titolo: "Sensori, motori e gravità: la meccanica incontra Arduino" },
    { nome: "Nomentano", titolo: "La pioggia celeste di Muoni: da Poisson allo studio dei raggi cosmici" },
    { nome: "G. Lombardo Radice", titolo: "Quando le onde che si incontrano... e la fisica si diverte a giocare!" },
    { nome: "Polo Liceale Alighieri - Dante Alighieri", titolo: "Virgo: sulle tracce dell'invisibile ritmo dell'Universo" },
    { nome: "Polo Liceale Alighieri - Dante Alighieri", titolo: "Oltre il limite di Heisenberg: schiacciare il vuoto quantistico" },
    { nome: "Vittoria Colonna", titolo: "Il pendolo nella storia" },
    { nome: "Flacco Potenza", titolo: "Analisi biomeccanica delle leve nel corpo umano" }
  ],
  
  "Musei Scientifici - Poster": [
    { nome: "Massimiliano Massimo", titolo: "Museo scientifico" },
    { nome: "Pertini Falcone", titolo: "Museo via Rugantino" }
  ],

  "Scienze della Terra - Poster": [
    { nome: "Labriola", titolo: "Esperienza Lab2Go del Liceo Labriola" },
    { nome: "Galileo Galilei Roma", titolo: "Dall'osservazione alla scopperta: studio di rocce, minerali e paesaggi" }
  ],

  "Biologia Animale - Talk": [
    { nome: "J.M. Keynes", titolo: "Il mondo dietro il microscopio: la magia della biologia dal procariote all’eucariote" },
    { nome: "Socrate Roma", titolo: "Dal reperto alla ricostruzione 3D" }
  ],

  "Biologia Vegetale - Talk": [
    { nome: "ITA Garibaldi Roma", titolo: "Progettazione e analisi metagenomica di una Tiny Forest: un approccio integrato tra agronomia, sostenibilità e sequenziamento di terza generazione" },
    { nome: "J.V. Neumann", titolo: "Caratterizzazione del viroma di piante spontanee di un parco urbano di Roma" },
    { nome: "Tullio Levi Civita", titolo: "Laboratorio di botanica" },
    { nome: "Pertini Falcone", titolo: "Laboratori biologia vegetale" }
  ],

  "Fisica - Talk": [
    { nome: "G. Lombardo Radice", titolo: "Il mistero del punto luminoso di Poisson" },
    { nome: "Polo Liceale Alighieri", titolo: "Vuoto e incertezza dal laboratorio a Virgo" }
  ],

  "Chimica - Talk": [
    { nome: "Terenzio Mamiani", titolo: "Quando la chimica incontra la sostenibilità" },
    { nome: "Cavour", titolo: "Pigmenti, gas, elettrochimica e acidità" },
    { nome: "Evangelista Torricelli", titolo: "Demistificare la chimica di tutti i giorni" },
    { nome: "Garibaldi", titolo: "Determinazione del potenziale biochimico di produzione di metano (BMT test) su matrici organiche di scarto" }
  ]
};

// =========================
// TOKEN
// =========================
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");

const validToken = !!token;


// =========================
// CONFIG
// =========================
const MAX_VOTES = 2;

// prende la disciplina (Fisica, Chimica, ecc.)
function getDisciplina(percorso) {
  return percorso.split(" - ")[0];
}

// =========================
//UI
// =========================
const voteContainer = document.getElementById("voteContainer");
Object.keys(percorsi).sort().forEach(percorso => {
    const div = document.createElement("div");
    div.className = "percorso";
    div.style.background = "#f8fafc";
    div.style.color = "#111";
    const h2 = document.createElement("h2");
    h2.innerText = percorso; div.appendChild(h2);
    const table = document.createElement("table");

percorsi[percorso].forEach(item => {
  const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="scuola">${item.nome}</td>
      <td class="titolo">${item.titolo}</td>
      <td><input type="checkbox" name="choice" value="${percorso}|${item.nome}"></td>
`   ;

  table.appendChild(tr);
});
       
    div.appendChild(table);
    voteContainer.appendChild(div);
});

// =========================
// BLOCCO MAX 2 SELEZIONI (FIX BUG)
// =========================
document.addEventListener("change", (e) => {
  if (e.target.name === "choice") {

    const checked = document.querySelectorAll("input[name='choice']:checked");

    if (checked.length > MAX_VOTES) {
      e.target.checked = false;
      alert("Puoi selezionare massimo 2 progetti");
    }
  }
});

// =========================
// FORM
// =========================
const form = document.createElement("form");
form.style.marginTop = "20px";

const submitBtn = document.createElement("button");
submitBtn.type = "submit";
submitBtn.innerText = "Invia voto";

form.appendChild(submitBtn);

// 👇 AGGIUNGI QUI
const statusMessage = document.getElementById("statusMessage");

if (!validToken) {

  statusMessage.className = "warning";

  statusMessage.innerHTML = `
    ⚠️ Per votare devi utilizzare un QR code valido.
  `;

  submitBtn.disabled = true;
  submitBtn.style.opacity = "0.5";
  submitBtn.style.cursor = "not-allowed";

} else {

  statusMessage.className = "success";

  statusMessage.innerHTML = `
    ✅ QR code valido. Puoi votare.
  `;
}

// IMPORTANTISSIMO: mettilo fuori dalle card, non dentro voteContainer
document.querySelector(".container").appendChild(form);

// =========================
// SUBMIT VOTO (APRE MODALE)
// =========================

form.addEventListener("submit", (e) => {
  e.preventDefault();

  const checked = document.querySelectorAll("input[name='choice']:checked");

  if (checked.length === 0) {
    alert("Seleziona almeno un progetto");
    return;
  }

  if (checked.length > MAX_VOTES) {
    alert("Massimo 2 voti");
    return;
  }

  const discipline = Array.from(checked).map(c =>
    getDisciplina(c.value.split("|")[0])
  );

  const uniche = new Set(discipline);

  if (checked.length === 2 && uniche.size === 1) {
    alert("Devi scegliere due discipline diverse");
    checked[checked.length - 1].checked = false;
    return;
  }

  openConfirm(checked);
});

function openConfirm(checked) {
  const confirmBox = document.getElementById("confirmBox");
  const confirmText = document.getElementById("confirmText");

  confirmText.innerHTML = "";

  checked.forEach(c => {
    const [percorso, scuola] = c.value.split("|");

    const p = document.createElement("p");
    p.innerText = `${percorso} → ${scuola}`;
    confirmText.appendChild(p);
  });

  confirmBox.style.display = "flex";
}

function closeConfirm() {
  document.getElementById("confirmBox").style.display = "none";
}
async function sendVotes() {

  const checked = document.querySelectorAll("input[name='choice']:checked");

  for (let scelta of checked) {

    const [percorso, scuola] = scelta.value.split("|");

    try {
      const res = await fetch("/vote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, percorso, scuola })
      });

      const data = await res.json();

      if (!data.success) {
        alert(data.error || "Errore durante il voto");
        return;
      }

    } catch (err) {
      alert("Errore di connessione al server");
      return;
    }
  }

  alert("Voto registrato con successo!");

  document.querySelectorAll("input[name='choice']")
    .forEach(c => c.checked = false);

  closeConfirm();
}

</script>
</body>
</html>
