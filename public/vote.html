<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Vota progetto LAB2GO</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #e6f0ff;
  margin: 0;
  text-align: center;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #fff;
  display: flex;
  justify-content: space-between;
  padding: 10px 20px;
  z-index: 1000;
}

.logo { height: 60px; }

.separator {
  position: fixed;
  top: 80px;
  width: 100%;
  height: 6px;
  background: #e0e0e0;
}

.container {
  max-width: 1000px;
  margin: 140px auto 30px;
}

h1 { color: #822433; }

.percorso {
  border-radius: 10px;
  margin-bottom: 30px;
  padding: 15px;
  background: #f8fafc;
}

.percorso h2 {
  color: #201c6b;
}

table {
  width: 100%;
}

td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  font-weight: bold;
}

.scuola { color: #822433; }
.titolo { color: #822433; font-style: italic; }

button {
  margin-top: 25px;
  padding: 14px 40px;
  font-size: 18px;
  font-weight: bold;
  background: #822433;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* MODALE */
#confirmBox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

#confirmInner {
  background: #1f2937;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 500px;
  color: white;
}
</style>
</head>

<body>

<header>
  <img src="logo1.png" class="logo">
  <img src="logo2.png" class="logo">
</header>

<div class="separator"></div>

<div class="container">
  <h1>Vota il progetto preferito (max 2)</h1>
  <div id="statusMessage"></div>
  <div id="voteContainer"></div>
</div>

<!-- MODALE -->
<div id="confirmBox">
  <div id="confirmInner">
    <h2>Conferma voto</h2>
    <div id="confirmText"></div>
    <br>
    <button id="confirmBtn" style="background:green;">Conferma</button>
    <button onclick="closeConfirm()" style="background:red;">Annulla</button>
  </div>
</div>

<script>
/* =========================
   DATI
========================= */

const percorsi = { /* 👈 il tuo oggetto invariato */ };

const MAX_VOTES = 2;

/* =========================
   STATE
========================= */

let remainingVotes = MAX_VOTES;
let projectId = 1;
let selectedChoices = [];

/* =========================
   INIT SAFE
========================= */

window.addEventListener("DOMContentLoaded", () => {
  renderAll();
  bindEvents();
});

/* =========================
   RENDER
========================= */

function renderAll() {
  const container = document.getElementById("voteContainer");
  if (!container) return;

  Object.keys(percorsi).forEach(percorso => {
    const block = createPercorsoBlock(percorso, percorsi[percorso]);
    container.appendChild(block);
  });
}

function createPercorsoBlock(percorso, items) {
  const div = document.createElement("div");
  div.className = "percorso";

  const h2 = document.createElement("h2");
  h2.textContent = percorso;
  div.appendChild(h2);

  const table = document.createElement("table");

  items.forEach(item => {
    const id = projectId++;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td style="width:50px">${id}</td>
      <td class="scuola">${item.nome}</td>
      <td class="titolo">${item.titolo}</td>
      <td>
        <input type="checkbox"
               value="${id}|${percorso}|${item.nome}|${item.titolo}">
      </td>
    `;

    table.appendChild(tr);
  });

  div.appendChild(table);
  return div;
}

/* =========================
   EVENTS
========================= */

function bindEvents() {

  document.addEventListener("change", (e) => {
    if (e.target.type === "checkbox") {
      handleSelectionLimit();
    }
  });

  document.getElementById("confirmBtn")
    .addEventListener("click", sendVotes);

  document.querySelector("form")?.addEventListener("submit", e => {
    e.preventDefault();
    openConfirm();
  });
}

/* =========================
   SELECTION LOGIC
========================= */

function handleSelectionLimit() {
  const checked = getChecked();

  if (checked.length > MAX_VOTES) {
    event.target.checked = false;
    alert("Hai raggiunto il limite di voti");
  }
}

function getChecked() {
  return document.querySelectorAll("input[type='checkbox']:checked");
}

/* =========================
   MODALE
========================= */

function openConfirm() {
  const checked = getChecked();

  if (checked.length === 0) {
    alert("Seleziona almeno un progetto");
    return;
  }

  const box = document.getElementById("confirmBox");
  const text = document.getElementById("confirmText");

  text.innerHTML = "";

  checked.forEach(c => {
    const [id, percorso, scuola, titolo] = c.value.split("|");

    const p = document.createElement("p");
    p.textContent = `#${id} → ${percorso} → ${scuola}`;
    text.appendChild(p);
  });

  box.style.display = "flex";
}

function closeConfirm() {
  document.getElementById("confirmBox").style.display = "none";
}

/* =========================
   SEND VOTES
========================= */

async function sendVotes() {
  const checked = getChecked();

  for (const c of checked) {
    const [id, percorso, scuola, titolo] = c.value.split("|");

    try {
      await fetch("/vote", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ percorso, scuola, titolo })
      });
    } catch (err) {
      console.error("Errore voto:", err);
    }
  }

  remainingVotes -= checked.length;

  updateStatus();

  checked.forEach(c => c.checked = false);
  closeConfirm();
}

/* =========================
   STATUS UI
========================= */

function updateStatus() {
  const el = document.getElementById("statusMessage");

  if (!el) return;

  if (remainingVotes <= 0) {
    el.textContent = "Hai esaurito i voti disponibili";
  } else {
    el.textContent = `Ti restano ${remainingVotes} voti`;
  }
}
</script>

</body>
</html>
