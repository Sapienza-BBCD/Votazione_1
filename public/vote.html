<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Vota il progetto preferito - LAB2GO</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #e6f0ff;
  margin: 0;
  text-align: center;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #fff;
  display: flex;
  justify-content: space-between;
  padding: 10px 20px;
  z-index: 1000;
}

.logo { height: 60px; }

.separator {
  position: fixed;
  top: 80px;
  width: 100%;
  height: 6px;
  background: #e0e0e0;
}

.container {
  max-width: 1000px;
  margin: 140px auto 30px;
}

h1 { color: #822433; }

.percorso {
  border-radius: 10px;
  margin-bottom: 30px;
  padding: 15px;
  color: #fff;
}

.table-container {
  background: #ffffffcc;
  border-radius: 8px;
  padding: 10px;
}

table { width: 100%; }

td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  color: #800000;
  font-weight: bold;
}

button {
  margin-top: 20px;
  padding: 12px 30px;
  font-size: 18px;
  background: #007BFF;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <img src="logo1.png" class="logo">
  <img src="logo2.png" class="logo">
</header>

<div class="separator"></div>

<div class="container">

<h1>Vota il progetto preferito - LAB2GO</h1>

<div id="voteContainer"></div>

</div>

<script>

// 🔥 NUOVA STRUTTURA (percorso + categoria)
const percorsi = {

"Fisica - Esperimento": [
  { nome: "IIS Gaetano De Sanctis", titolo: "Sensori, Motori e Gravità" },
  { nome: "G. Lombardo Radice", titolo: "Ipnosi dei pendoli magici" },
  { nome: "G. Lombardo Radice", titolo: "Tubo di Quincke" },
  { nome: "G. Lombardo Radice", titolo: "Polarizzazione della luce" },
  { nome: "Liceo Scientifico Augusto Righi Roma", titolo: "Sensore ultrasuoni HC SR04" },
  { nome: "Vittoria Colonna", titolo: "Il pendolo nella storia" },
  { nome: "Liceo Classico Pilo Albertelli Roma", titolo: "Il coherer e onde elettromagnetiche" },
  { nome: "Liceo Flacco Potenza", titolo: "Diffrazione ottica" }
],

"Chimica - Esperimento": [
  { nome: "Liceo Terenzio Mamiani", titolo: "Chimica e sostenibilità" },
  { nome: "Liceo Scientifico Cavour", titolo: "Pigmenti, gas ed elettrochimica" },
  { nome: "Pertini-Falcone", titolo: "Percorsi di chimica sperimentale" }
],

"Biologia Vegetale - Esperimento": [
  { nome: "ITA G. Garibaldi Roma", titolo: "Filiera Mais No-OGM (PCR)" },
  { nome: "ITA Garibaldi + Liceo Righi Roma", titolo: "Tiny Forest e suolo" }
],

"Fisica - Poster": [
  { nome: "Liceo Vian Bracciano", titolo: "Legge di Lambert-Beer" },
  { nome: "IIS Gaetano De Sanctis", titolo: "Meccanica con Arduino" },
  { nome: "Liceo Nomentano", titolo: "Muoni e raggi cosmici" },
  { nome: "G. Lombardo Radice", titolo: "Onde che si incontrano" },
  { nome: "Polo Liceale Alighieri", titolo: "Virgo e onde gravitazionali" },
  { nome: "Polo Liceale Alighieri", titolo: "Limite di Heisenberg" },
  { nome: "Vittoria Colonna", titolo: "Il pendolo nella storia" },
  { nome: "Liceo Flacco Potenza", titolo: "Biomeccanica leve" }
],

"Scienze della Terra - Poster": [
  { nome: "Liceo Labriola", titolo: "Esperienza Lab2Go" },
  { nome: "Galileo Galilei Roma", titolo: "Rocce, minerali e paesaggi" }
],

"Chimica - Poster": [
  { nome: "Liceo Scientifico Cavour", titolo: "Pigmenti e acidità" },
  { nome: "Evangelista Torricelli", titolo: "Chimica quotidiana" },
  { nome: "IT Agrario Giuseppe Garibaldi", titolo: "Produzione metano (BMT)" }
],

"Biologia Vegetale - Poster": [
  { nome: "Liceo Augusto Righi Roma", titolo: "Tiny Forest metagenomica" },
  { nome: "Liceo Augusto Righi Roma", titolo: "Analisi Tiny Forest" }
],

"Biologia Animale - Poster": [
  { nome: "ITT Livia Bottardi", titolo: "Cellule al microscopio" }
],

"Musei Scientifici - Poster": [
  { nome: "Istituto Massimiliano Massimo", titolo: "Museo scientifico" },
  { nome: "IIS Pertini Falcone", titolo: "Museo via Rugantino" }
],

"Fisica - Talk": [
  { nome: "G. Lombardo Radice", titolo: "Punto luminoso di Poisson" },
  { nome: "Polo Liceale Alighieri", titolo: "Vuoto e incertezza" }
],

"Chimica - Talk": [
  { nome: "Liceo Terenzio Mamiani", titolo: "Chimica e sostenibilità" },
  { nome: "Liceo Scientifico Cavour", titolo: "Pigmenti e acidità" },
  { nome: "Evangelista Torricelli", titolo: "Chimica quotidiana" }
],

"Biologia Vegetale - Talk": [
  { nome: "ITA Garibaldi Roma", titolo: "Tiny Forest avanzata" },
  { nome: "IISS J.V. Neumann", titolo: "Viroma piante urbane" },
  { nome: "Tullio Levi Civita", titolo: "Laboratorio botanica" },
  { nome: "Pertini-Falcone", titolo: "Laboratori biologia vegetale" }
],

"Biologia Animale - Talk": [
  { nome: "Istituto J.M. Keynes", titolo: "Dal procariote all’eucariote" },
  { nome: "Liceo Socrate Roma", titolo: "Ricostruzione 3D" }
]

};

const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");
const MAX_VOTES = 2;

const voteContainer = document.getElementById("voteContainer");

// CREAZIONE UI
Object.keys(percorsi).sort().forEach(percorso => {

  const div = document.createElement("div");
  div.className = "percorso";
  div.style.background = "#3b82f6";

  const h2 = document.createElement("h2");
  h2.innerText = percorso;
  div.appendChild(h2);

  const tableDiv = document.createElement("div");
  tableDiv.className = "table-container";

  const table = document.createElement("table");

  percorsi[percorso].forEach(item => {

    const tr = document.createElement("tr");

    const tdNome = document.createElement("td");
    tdNome.innerText = item.nome;

    const tdTitolo = document.createElement("td");
    tdTitolo.innerText = item.titolo;
    tdTitolo.style.fontStyle = "italic";

    const tdCheck = document.createElement("td");
    const input = document.createElement("input");

    input.type = "checkbox";
    input.name = "choice";

    // 🔥 IMPORTANTE
    input.value = `${percorso}|${item.nome}`;

    tdCheck.appendChild(input);

    tr.appendChild(tdNome);
    tr.appendChild(tdTitolo);
    tr.appendChild(tdCheck);

    table.appendChild(tr);

  });

  tableDiv.appendChild(table);
  div.appendChild(tableDiv);
  voteContainer.appendChild(div);

});

// FORM
const form = document.createElement("form");

const submit = document.createElement("button");
submit.innerText = "Invia voto";

form.appendChild(submit);
voteContainer.appendChild(form);

// INVIO
form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const checked = document.querySelectorAll("input[name='choice']:checked");

  if (checked.length === 0) {
    alert("Seleziona almeno un progetto");
    return;
  }

  if (checked.length > MAX_VOTES) {
    alert("Massimo 2 voti");
    return;
  }

  const percorsiSelezionati = Array.from(checked).map(c => c.value.split("|")[0]);
  const unici = new Set(percorsiSelezionati);

  if (checked.length === 2 && unici.size === 1) {
    alert("Devi scegliere percorsi diversi");
    return;
  }

  for (let scelta of checked) {

    const [percorso, scuola] = scelta.value.split("|");

    const res = await fetch("/vote", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ token, percorso, scuola })
    });

    const data = await res.json();

    if (!data.success) {
      alert(data.error);
      return;
    }
  }

  alert("Voto registrato!");

});
</script>

</body>
</html>
