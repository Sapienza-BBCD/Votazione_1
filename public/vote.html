<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Vota progetto LAB2GO</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #e6f0ff;
  margin: 0;
  text-align: center;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #fff;
  display: flex;
  justify-content: space-between;
  padding: 10px 20px;
  z-index: 1000;
}

.logo { height: 60px; }

.separator {
  position: fixed;
  top: 80px;
  width: 100%;
  height: 6px;
  background: #e0e0e0;
}

.container {
  max-width: 1000px;
  margin: 140px auto 30px;
}

h1 { color: #822433; }

.percorso {
  border-radius: 10px;
  margin-bottom: 30px;
  padding: 15px;
  background: #f8fafc;
}

.percorso h2 {
  color: #201c6b;
}

table {
  width: 100%;
}

td {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  font-weight: bold;
}

.scuola { color: #822433; }
.titolo { color: #822433; font-style: italic; }

button {
  margin-top: 25px;
  padding: 14px 40px;
  font-size: 18px;
  font-weight: bold;
  background: #822433;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* MODALE */
#confirmBox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

#confirmInner {
  background: #1f2937;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 500px;
  color: white;
}
</style>
</head>

<body>

<header>
  <img src="logo1.png" class="logo">
  <img src="logo2.png" class="logo">
</header>

<div class="separator"></div>

<div class="container">
  <h1>Vota il progetto preferito (max 2)</h1>

  <div id="statusMessage"></div>
  <div id="voteContainer"></div>

  <button onclick="openConfirm()">Invia voto</button>
</div>

<!-- MODALE -->
<div id="confirmBox">
  <div id="confirmInner">
    <h2>Conferma voto</h2>
    <div id="confirmText"></div>
    <br>
    <button id="confirmBtn" style="background:green;">Conferma</button>
    <button onclick="closeConfirm()" style="background:red;">Annulla</button>
  </div>
</div>

<script>

/* =========================
   DATI
========================= */

const percorsi = {
  "Fisica - Esperimento": [
    { nome: "Liceo A", titolo: "Esperimento 1" },
    { nome: "Liceo B", titolo: "Esperimento 2" }
  ],
  "Chimica - Poster": [
    { nome: "Liceo C", titolo: "Esperimento 3" }
  ]
};

const MAX_VOTES = 2;

let projectId = 1;

/* =========================
   INIT
========================= */

window.addEventListener("DOMContentLoaded", () => {
  renderPercorsi();

  document.getElementById("confirmBtn")
    .addEventListener("click", sendVotes);
});

/* =========================
   RENDER
========================= */

function renderPercorsi() {

  const container = document.getElementById("voteContainer");
  container.innerHTML = "";

  Object.entries(percorsi).forEach(([percorso, items]) => {

    const block = document.createElement("div");
    block.className = "percorso";

    const h2 = document.createElement("h2");
    h2.textContent = percorso;
    block.appendChild(h2);

    const table = document.createElement("table");

    items.forEach(item => {

      const id = projectId++;

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${id}</td>
        <td class="scuola">${item.nome}</td>
        <td class="titolo">${item.titolo}</td>
        <td>
          <input type="checkbox"
            value="${id}|${percorso}|${item.nome}|${item.titolo}">
        </td>
      `;

      table.appendChild(tr);
    });

    block.appendChild(table);
    container.appendChild(block);
  });
}

/* =========================
   LIMIT VOTI
========================= */

document.addEventListener("change", (e) => {

  if (e.target.type === "checkbox") {

    const checked = document.querySelectorAll("input:checked");

    if (checked.length > MAX_VOTES) {
      e.target.checked = false;
      alert("Puoi selezionare massimo 2 progetti");
    }
  }
});

/* =========================
   HELPERS
========================= */

function getChecked() {
  return document.querySelectorAll("input[type='checkbox']:checked");
}

/* =========================
   MODALE
========================= */

function openConfirm() {

  const checked = getChecked();

  if (checked.length === 0) {
    alert("Seleziona almeno un progetto");
    return;
  }

  const box = document.getElementById("confirmBox");
  const text = document.getElementById("confirmText");

  text.innerHTML = "";

  checked.forEach(c => {
    const [id, percorso, scuola] = c.value.split("|");

    const p = document.createElement("p");
    p.textContent = `#${id} → ${percorso} → ${scuola}`;
    text.appendChild(p);
  });

  box.style.display = "flex";
}

function closeConfirm() {
  document.getElementById("confirmBox").style.display = "none";
}

/* =========================
   INVIO VOTO
========================= */

async function sendVotes() {

  const checked = getChecked();

  if (checked.length === 0) return;

  for (const c of checked) {

    const [id, percorso, scuola, titolo] = c.value.split("|");

    try {
      await fetch("/vote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ percorso, scuola, titolo })
      });
    } catch (err) {
      console.error(err);
    }
  }

  alert("Voto registrato con successo!");

  checked.forEach(c => c.checked = false);

  closeConfirm();
}

</script>

</body>
</html>
